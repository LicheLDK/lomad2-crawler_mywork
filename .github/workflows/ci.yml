name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Run lint
        run: |
          npm run lint:ci
          npm run web:lint:ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npx jest --runInBand

      - name: Build frontend
        run: npm --prefix web run build

  # 빈 볼륨에 마이그레이션을 적용하는 통합 검증.
  # Docker Compose 를 띄우므로 build-test 와 분리해 기존 job 시간에 영향을 주지 않는다.
  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migration empty-volume test
        run: bash scripts/test-migration-empty-volume.sh
