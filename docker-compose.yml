services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-crawler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crawler}
      POSTGRES_DB: ${DB_NAME:-search_crawler}
    # 호스트는 loopback만 노출 (외부 LAN SSRF/스캔 완화). 컨테이너 간은 서비스명으로 통신.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # API/Worker 기동 전 스키마 적용 (빈 volume 대응)
  migrate:
    build: .
    command: ["npm", "run", "migration:run:prod"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-crawler}
      DB_PASSWORD: ${DB_PASSWORD:-crawler}
      DB_NAME: ${DB_NAME:-search_crawler}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  crawler-api:
    build: .
    command: ["node", "-r", "./dist/register-paths.js", "dist/main.js"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-crawler}
      DB_PASSWORD: ${DB_PASSWORD:-crawler}
      DB_NAME: ${DB_NAME:-search_crawler}
      REDIS_HOST: redis
      ELASTIC_NODE: http://elastic:9200
      ENABLE_WORKER: "false"
      PORT: 3100
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - image_storage:/app/storage/images
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elastic:
        condition: service_healthy

  crawler-worker:
    build: .
    command: ["node", "-r", "./dist/register-paths.js", "dist/worker.js"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-crawler}
      DB_PASSWORD: ${DB_PASSWORD:-crawler}
      DB_NAME: ${DB_NAME:-search_crawler}
      REDIS_HOST: redis
      ELASTIC_NODE: http://elastic:9200
      ENABLE_WORKER: "true"
      CRAWL_CONCURRENCY: 5
    volumes:
      - image_storage:/app/storage/images
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elastic:
        condition: service_healthy
    deploy:
      replicas: 1

  # React 대시보드 (nginx 정적 + /api·socket.io → crawler-api)
  dashboard:
    build:
      context: ./web
      args:
        VITE_API_BASE: /api
        VITE_SOCKET_URL: ""
        VITE_BACKOFFICE_ORDER_URL_TEMPLATE: ${BACKOFFICE_ORDER_URL_TEMPLATE:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - crawler-api

volumes:
  pgdata:
  esdata:
  image_storage:
